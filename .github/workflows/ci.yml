name: CI

# Pro's own tests, the invariant that Pro adds nothing to the free plugin, the
# integration suite that runs both plugins in one WordPress, and the rule that
# nothing secret is committed.
#
# Three of these need both trees, and they get both. scornik/debloater is public
# now, so it is checked out like any other public repository -- no token, no
# `continue-on-error`, and no job that can pass by not looking. That was not
# true when this file was written: the free plugin was private, the checkout
# needed a FREE_PLUGIN_TOKEN nobody had configured, and the invariants asserting
# "Pro adds nothing to Debloater" skipped on every run while reporting success.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v5
        with:
          path: debloater-pro

      # Beside this one, which is the layout the tests look for and the layout
      # README.md tells a person to use.
      - name: The free plugin
        uses: actions/checkout@v5
        with:
          repository: scornik/debloater
          path: debloater

      # Required, not hoped for. Every invariant in tests/Pro is a claim about
      # Pro *and* Debloater together; without the second tree they answer
      # affirmatively and prove nothing.
      - name: The free plugin is really here
        run: test -f debloater/hakeemify-debloater.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, sodium
          coverage: none

      - name: Install
        working-directory: debloater-pro
        run: composer install --no-interaction --no-progress

      - name: Pro's suite
        working-directory: debloater-pro
        run: vendor/bin/phpunit --testsuite=pro

      # Nothing in this suite may skip. The free plugin is checked out
      # unconditionally now, so a skip means a test looked for it somewhere it
      # is not -- which is how ReadmeTest's "Tested up to" comparison sat out
      # every run it was ever part of.
      - name: Nothing skipped
        working-directory: debloater-pro
        run: |
          output=$(vendor/bin/phpunit --testsuite=pro 2>&1)
          echo "$output"

          if echo "$output" | grep -q "Skipped"; then
            echo "::error::A test skipped even though the free plugin is present."
            exit 1
          fi

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          path: debloater-pro

      # PHPStan needs it for the same reason the tests do, and for a different
      # purpose: Pro names types that belong to the free plugin, and without
      # them level 6 reports several hundred unknown classes, every one of them
      # meaning "the other repository is not here".
      - name: The free plugin
        uses: actions/checkout@v5
        with:
          repository: scornik/debloater
          path: debloater

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium
          coverage: none

      - name: Install
        working-directory: debloater-pro
        run: composer install --no-interaction --no-progress

      # Reads Pro alone, so it runs whether or not the free plugin is here.
      - name: PHPCS
        working-directory: debloater-pro
        run: vendor/bin/phpcs

      - name: PHPStan
        working-directory: debloater-pro
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # Pro against a real WordPress, with the free plugin active beside it.
  #
  # This is the job that did not exist. Splitting Pro out took the wp-env
  # mapping and the PHPUnit suite with it, and tests/Integration came here with
  # nothing anywhere able to run it -- so ProScreenTest and ProIntegrationTest
  # were present, correct and uncollected for four commits. Not failing, not
  # skipping: never run, which reads exactly like fine.
  #
  # Everything WordPress lives in the free plugin's checkout: its .wp-env.json,
  # its PHPUnit 9 phar, its bootstrap. This job stands that environment up and
  # points it at Pro's configuration, which is what a person does locally too --
  # `npm run test:integration:pro`, the same script, so there is one path rather
  # than a CI-shaped imitation of one.
  #
  # The mapping that puts Pro in the container is generated here from the
  # template committed in the free repository. It is a template there rather
  # than a default because wp-env can only map a directory that exists, and
  # that repository has to start for people who do not have Pro.
  integration:
    name: Integration (Pro + Debloater)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          path: debloater-pro

      - uses: actions/checkout@v5
        with:
          repository: scornik/debloater
          path: debloater

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: debloater/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium
          coverage: none

      # Pro's autoloader. The suite constructs Pro's classes directly rather
      # than loading debloater-pro.php, so this is all Pro needs.
      - name: Install Pro
        working-directory: debloater-pro
        run: composer install --no-interaction --no-progress

      - name: Install Debloater
        working-directory: debloater
        run: npm ci

      # The WordPress test suite needs Yoast's PHPUnit Polyfills, a Composer dev
      # dependency of the free plugin. Its directory is mapped into the
      # container as-is, so a missing vendor/ here is a missing vendor/ there.
      - name: Debloater's dev dependencies
        working-directory: debloater
        run: composer install --no-interaction --no-progress

      # PHPUnit 9 for the WordPress test suite is a phar, downloaded rather than
      # committed. WP_UnitTestCase is not compatible with PHPUnit 10.
      - name: PHPUnit 9
        working-directory: debloater
        run: npm run test:integration:setup

      # From the committed template, rather than written out here. Two copies of
      # a mapping is two things to keep in step, and the template is the one a
      # person reads.
      - name: Map Pro into the environment
        working-directory: debloater
        run: |
          cp .wp-env.override.json.dist .wp-env.override.json
          cat .wp-env.override.json

      - name: Start WordPress
        working-directory: debloater
        run: npx wp-env start --update

      # wp-env activates the plugins listed in .wp-env.json. Debloater is
      # mapped rather than listed, so on a fresh runner it is installed and
      # inactive.
      #
      # Pro is deliberately *not* activated. Its entry point initialises the
      # licensing SDK, which on activation reaches for a network these tests do
      # not need and CI should not depend on. The suite constructs Pro's classes
      # directly -- `new Pro( $plugin, FixtureEntitlementProvider::everything() )`
      # -- which is what every one of these tests already does, and the reason
      # the mapping only has to make the files reachable.
      - name: Activate Debloater
        working-directory: debloater
        run: npx wp-env run cli wp plugin activate debloater

      # The same command a person runs. It refuses, with an explanation, when
      # the mapping is missing -- so a broken environment here says why rather
      # than failing about a path inside a container.
      - name: Pro's integration suite
        working-directory: debloater
        run: npm run test:integration:pro

      - name: Stop WordPress
        working-directory: debloater
        if: always()
        run: npx wp-env stop

  # The release archive, and the rule that it cannot ship changed code under an
  # unchanged version number.
  #
  # Pro had neither a packaging job nor a shipped-content record until now, and
  # no tags at all -- so nothing could tell whether its code had moved since the
  # version last did. It had, repeatedly.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, sodium, zip
          coverage: none

      - run: npm ci

      # The Freemius SDK ships inside the plugin, so it is a runtime dependency
      # and --no-dev keeps everything else out.
      - name: Production dependencies
        run: composer install --no-interaction --no-progress --no-dev --classmap-authoritative

      - run: npm run plugin-zip

      - name: Content and version agree
        run: node tools/version-discipline.mjs

  secrets:
    name: Nothing secret ships
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # BUILD-SPEC §13 rule 15. Pro is the half of this product that talks to a
      # payment platform, so it is the half where a key would end up.
      #
      # The patterns below want a *value*, not a mention. The first version
      # searched for the bare strings `sk_live`, `secret_key` and `SECRET_KEY`,
      # and failed on the two files that spell those patterns out: this workflow
      # and tests/Pro/ProArchitectureTest.php, which contains the same check as
      # a PHPUnit test. Neither held a secret. A scanner that reports its own
      # pattern list has found nothing, and teaches everybody to ignore it.
      #
      # `sk_live` is not a secret. `sk_live_` followed by sixteen characters is.
      # That distinction removes the false positives without removing a single
      # pattern, and the same rule is what the architecture test already uses.
      - name: No private keys or store secrets
        run: |
          set -o pipefail

          # A value-bearing token, a private key with a body, or an assignment
          # of a store secret to something that is not a placeholder.
          patterns=(
            '(sk_live|sk_test|pk_live|rk_live|ghp_|gho_|github_pat_)[A-Za-z0-9_]{16}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            "(SECRET_KEY|secret_key)['\"]?[[:space:]]*[=:>][[:space:]]*['\"][A-Za-z0-9_/+-]{12}"
            # The licensing platform's own secret, which is what a developer
            # pastes into wp-config.php while integrating and is the single
            # most likely thing to end up committed by accident. It is a
            # different value from the public key in config/freemius.php.dist,
            # which is not secret and ships.
            "WP_FS__[A-Za-z0-9_-]+_SECRET_KEY['\"]?[[:space:]]*[,=:)>][[:space:]]*['\"][A-Za-z0-9_/+-]{8}"
          )

          # Exactly two files are exempt, by full path, because they are where
          # the patterns are written down. Nothing else is exempt, and both are
          # required to exist so that renaming one cannot widen this quietly.
          for defining in .github/workflows/ci.yml tests/Pro/ProArchitectureTest.php; do
            if [ ! -f "$defining" ]; then
              echo "::error::$defining is exempt from the secret scan but does not exist."
              echo "::error::Either restore it or remove it from the exemption below."
              exit 1
            fi
          done

          found=0

          for pattern in "${patterns[@]}"; do
            # -e, because a pattern starting with "-----" is otherwise read
            # as a bundle of options. The private-key check silently never ran
            # until a fail-probe planted a real key and the guard said CLEAN.
            hits=$(grep -rInIE -e "$pattern" \
                     --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules . \
                   | grep -v '^\./\.github/workflows/ci\.yml:' \
                   | grep -v '^\./tests/Pro/ProArchitectureTest\.php:' || true)

            if [ -n "$hits" ]; then
              echo "::error::A value matching a secret pattern is committed:"
              echo "$hits"
              found=1
            fi
          done

          # The store's own configuration, which holds identifiers that must not
          # be published. .distignore excludes it from packages; this keeps it
          # out of the repository in the first place.
          if [ -f config/freemius.php ]; then
            echo "::error::config/freemius.php is committed; it holds store identifiers."
            found=1
          fi

          if [ "$found" -eq 0 ]; then
            echo "No private keys, tokens or store secrets are committed."
          fi

          exit $found
